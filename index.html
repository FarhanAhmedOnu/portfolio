<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Farhan Ahmed Onu — Portfolio</title>
<meta name="description" content="Portfolio of Farhan Ahmed Onu — CSE graduate and MSc researcher at Jahangirnagar University working on deep learning, efficient/quantized models for edge deployment, medical image analysis, and explainable AI." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />

<script>
  (function () {
    var saved = localStorage.getItem("theme");
    if (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches) saved = "dark";
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  })();
</script>
</head>

<body id="top">

<a class="skip-link" href="#main">Skip to content</a>

<!-- ================= HEADER ================= -->
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="#top">Farhan Ahmed Onu<span>.</span></a>
    <nav class="nav" aria-label="Sections">
      <a href="#about">About</a>
      <a href="#research">Research</a>
      <a href="#projects">Projects</a>
      <a href="#education">Education</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button"
            aria-label="Toggle dark mode" aria-pressed="false">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<!-- ================= LOAD ERROR ================= -->
<div id="load-error" class="load-error" role="alert" hidden></div>

<!-- ================= SIDEBAR + MAIN ================= -->
<div class="layout">

  <!-- Sidebar — profile -->
  <aside class="sidebar" aria-label="Profile">
    <p class="eyebrow" id="hero-eyebrow"></p>
    <h1 id="hero-name"></h1>
    <p class="role" id="hero-role"></p>
    <div class="hero-links" id="hero-links"></div>
  </aside>

  <!-- Main content -->
  <main id="main" class="content">

    <!-- About (takes the old hero summary) -->
    <section class="block" id="about">
      <div class="section-head">
        <h2 class="section-title">About</h2>
      </div>
      <p class="hero-summary" id="hero-summary"></p>
    </section>

    <!-- Research -->
    <section class="block" id="research">
      <div class="container">
        <div class="section-head">
          <h2 class="section-title" data-bind="title">Research &amp; Publications</h2>
          <p class="section-desc" data-bind="description"></p>
        </div>
        <div class="pub-list" id="pub-list"></div>
      </div>
    </section>

    <!-- Projects -->
    <section class="block" id="projects">
      <div class="container">
        <div class="section-head">
          <h2 class="section-title" data-bind="title">Software &amp; Engineering Projects</h2>
          <p class="section-desc" data-bind="description"></p>
        </div>
        <div class="project-grid" id="project-list"></div>
      </div>
    </section>

    <!-- Education -->
    <section class="block" id="education">
      <div class="container">
        <div class="section-head">
          <h2 class="section-title" data-bind="title">Education</h2>
          <p class="section-desc" data-bind="description"></p>
        </div>
        <div class="card" id="edu-list"></div>
      </div>
    </section>

    <!-- Skills -->
    <section class="block" id="skills">
      <div class="container">
        <div class="section-head">
          <h2 class="section-title" data-bind="title">Technical Skills</h2>
          <p class="section-desc" data-bind="description"></p>
        </div>
        <div class="skill-grid" id="skill-list"></div>
      </div>
    </section>

    <!-- References -->
    <section class="block" id="contact">
      <div class="container">
        <div class="section-head">
          <h2 class="section-title" data-bind="title">References</h2>
          <p class="section-desc" data-bind="description"></p>
        </div>
        <div class="ref-grid" id="ref-list"></div>
      </div>
    </section>

  </main>
</div>

<footer class="site-footer container">
  <span>&copy; <span id="year"></span> Farhan Ahmed Onu</span>
  <span>Static site — data lives in <code>/data</code> as JSON.</span>
</footer>

<noscript>
  <div class="load-error">
    This portfolio loads its content from JSON files and needs JavaScript enabled.
  </div>
</noscript>

<script type="module" src="js/theme.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
